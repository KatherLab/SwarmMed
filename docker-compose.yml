version: "3.9"
services:
  web:
    build: .
    container_name: django_app
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    depends_on:
      - minio

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"  # MinIO Console
    environment:
      MINIO_ROOT_USER: minio_access_key
      MINIO_ROOT_PASSWORD: minio_secret_key
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

volumes:
  minio-data: