services:
  app:
    container_name: swarmcloud
    command: gunicorn --bind 0.0.0.0:8000 --workers 4 --threads 8 --worker-class gthread --access-logfile - --error-logfile - --log-level info --max-requests 1000 --max-requests-jitter 50 core.wsgi:application
    restart: always
    shm_size: '10.24gb'
    build:
      context: .
    networks:
      - db_network
      - web_network
    volumes:
      - ./:/app # :ro for production
      - ./:/workspace:ro
      - ./tmp:/app/tmp
      - ./media:/app/media
      - static_data:/app/staticfiles
      - ./workspaces:/app/workspaces
      - ./.secrets/certs/internal/ca.crt:/usr/local/share/ca-certificates/internal-ca.crt:ro
      - ./.secrets/docker/client:/certs/client:ro
    depends_on:
      - postgres
      - pgbouncer
      - redis
      - docker-proxy
      - sandbox-dind
      - tailscale-status
    env_file:
      - .env
    environment:
      - REQUESTS_CA_BUNDLE=/usr/local/share/ca-certificates/internal-ca.crt
      - SSL_CERT_FILE=/usr/local/share/ca-certificates/internal-ca.crt
      - AWS_CA_BUNDLE=/usr/local/share/ca-certificates/internal-ca.crt
      - HOST_PROJECT_PATH=${HOST_PROJECT_PATH}
      - DOCKER_HOST=tcp://docker-proxy:2375
      - TAILSCALE_STATUS_BASE_URL=http://tailscale-status:9002
      - PGBOUNCER_CONTAINER_NAME=pgbouncer
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "5085:5085"
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/app.conf:/etc/nginx/conf.d/default.conf
      - ./.secrets/certs/nginx:/etc/nginx/certs:ro
      - ./infrastructure/certbot/conf:/etc/letsencrypt
      - ./infrastructure/certbot/www:/var/www/certbot
    depends_on:
      - app
    networks:
      - web_network

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./infrastructure/certbot/conf:/etc/letsencrypt
      - ./infrastructure/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - web_network

  celery_worker:
    container_name: celery_worker
    command: celery -A core worker -B --loglevel=info --concurrency=8 --prefetch-multiplier=2
    restart: always
    shm_size: '10.24gb'
    build:
      context: .
    networks:
      - db_network
    volumes:
      - ./:/app # :ro for production
      - ./:/workspace:ro
      - ./tmp:/app/tmp
      - ./media:/app/media
      - static_data:/app/staticfiles
      - ./workspaces:/app/workspaces
      - ./.secrets/certs/internal/ca.crt:/usr/local/share/ca-certificates/internal-ca.crt:ro
      - ./.secrets/docker/client:/certs/client:ro
    depends_on:
      - postgres
      - pgbouncer
      - redis
      - docker-proxy
      - sandbox-dind
      - tailscale-status
    env_file:
      - .env
    environment:
      - REQUESTS_CA_BUNDLE=/usr/local/share/ca-certificates/internal-ca.crt
      - SSL_CERT_FILE=/usr/local/share/ca-certificates/internal-ca.crt
      - AWS_CA_BUNDLE=/usr/local/share/ca-certificates/internal-ca.crt
      - SKIP_MIGRATIONS=1
      - CELERY_WORKER=1
      - HOST_PROJECT_PATH=${HOST_PROJECT_PATH}
      - DOCKER_HOST=tcp://docker-proxy:2375
      - TAILSCALE_STATUS_BASE_URL=http://tailscale-status:9002
      - PGBOUNCER_CONTAINER_NAME=pgbouncer
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-proxy
    restart: always
    environment:
      - CONTAINERS=1
      - NETWORKS=1
      - IMAGES=1
      - VOLUMES=1
      - BUILD=1
      - POST=1
      - INFO=1
      - VERSION=1
      - EXEC=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - db_network

  sandbox-dind:
    image: docker:26-dind
    container_name: sandbox-dind
    privileged: true
    restart: always
    shm_size: '10.24gb'
    networks:
      - db_network
      - sandbox_internal
    environment:
      - DOCKER_TLS_CERTDIR=/certs
      - DOCKER_TLS_SAN=DNS:sandbox-dind
    volumes:
      - ./.secrets/docker:/certs
      - ./:/workspace
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  tailscale-status:
    build:
      context: .
      dockerfile: services/tailscale_status/Dockerfile
    container_name: tailscale-status
    restart: always
    networks:
      - db_network
      - web_network
    volumes:
      - /var/run/tailscale:/var/run/tailscale:ro
      - /usr/bin/tailscale:/usr/bin/tailscale:ro
    environment:
      - PORT=9002
      - TAILSCALE_BIN=/usr/bin/tailscale
      - TAILSCALE_SOCKET=/var/run/tailscale/tailscaled.sock

  redis:
    image: redis:7.0.12
    container_name: redis
    command:
      - redis-server
      - --port
      - "0"
      - --tls-port
      - "6379"
      - --tls-cert-file
      - /etc/redis/certs/redis.crt
      - --tls-key-file
      - /etc/redis/certs/redis.key
      - --tls-ca-cert-file
      - /etc/redis/certs/ca.crt
      - --tls-auth-clients
      - "no"
      - --requirepass
      - "${REDIS_PASSWORD}"
      - --slave-read-only
      - "no"
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./.secrets/certs/internal/redis.crt:/etc/redis/certs/redis.crt:ro
      - ./.secrets/certs/internal/redis.key:/etc/redis/certs/redis.key:ro
      - ./.secrets/certs/internal/ca.crt:/etc/redis/certs/ca.crt:ro
    networks:
      - db_network


  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    entrypoint: /usr/local/bin/custom_entrypoint.sh
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./.secrets/certs/internal/postgres.crt:/var/lib/postgresql/server.crt:ro
      - ./.secrets/certs/internal/postgres.key:/var/lib/postgresql/server.key:ro
      - ./.secrets/certs/internal/ca.crt:/var/lib/postgresql/root.crt:ro
      - ./scripts/init_postgres_ssl.sh:/docker-entrypoint-initdb.d/init_postgres_ssl.sh:ro
      - ./infrastructure/postgres/entrypoint.sh:/usr/local/bin/custom_entrypoint.sh:ro
      - ./infrastructure/postgres/update_password.sh:/usr/local/bin/update_password.sh:ro
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/server.crt
      -c ssl_key_file=/var/lib/postgresql/server.key
      -c ssl_ca_file=/var/lib/postgresql/root.crt
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - .env
    networks:
      - db_network

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    restart: always
    volumes:
      - ./.secrets/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./.secrets/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
      - ./.secrets/certs/internal/ca.crt:/etc/pgbouncer/certs/ca.crt:ro
      - ./.secrets/certs/internal/pgbouncer.crt:/etc/pgbouncer/certs/pgbouncer.crt:ro
      - ./.secrets/certs/internal/pgbouncer.key:/etc/pgbouncer/certs/pgbouncer.key:ro
    depends_on:
      - postgres
    networks:
      - db_network
    expose:
      - "5432"

  minio:
    image: minio/minio
    container_name: minio
    volumes:
      - minio_data:/data
      - ./.secrets/certs/internal/minio_certs:/root/.minio/certs:ro
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    environment:
      - MINIO_KMS_SECRET_KEY=${MINIO_KMS_SECRET_KEY}
    command: server /data --console-address ":9001"
    networks:
      - db_network
      - sandbox_internal


networks:
  db_network:
    driver: bridge
  web_network:
    driver: bridge
  sandbox_internal:
    driver: bridge
    internal: true

volumes:

  # Sensitive data volumes using a placeholder driver for encryption.

  # Change the driver and options according to your host encryption solution 

  # (e.g., LUKS, cloud provider encrypted block storage).

  postgres_data:

    driver: local

  minio_data:

    driver: local

  static_data:

    driver: local
