{% extends "layouts/base-auth.html" %}
{% load static %}

{% block content %}
    <style>
        /* Force styling for django-two-factor-auth form fields to match sign-in.html */
        input[type="text"],
        input[type="password"],
        input[type="number"],
        input[type="email"],
        select {
            background-color: #f9fafb; /* bg-gray-50 */
            border: 1px solid #d1d5db; /* border-gray-300 */
            color: #111827; /* text-gray-900 */
            font-size: 0.875rem; /* sm:text-sm */
            border-radius: 0.5rem; /* rounded-lg */
            display: block;
            width: 100%;
            padding: 0.625rem; /* p-2.5 */
        }
        .dark input[type="text"],
        .dark input[type="password"],
        .dark input[type="number"],
        .dark input[type="email"],
        .dark select {
            background-color: #374151; /* dark:bg-gray-700 */
            border-color: #4b5563; /* dark:border-gray-600 */
            color: #ffffff; /* dark:text-white */
        }
        input:focus {
            --tw-ring-color: #1d4ed8; /* focus:ring-primary-300 / 600 */
            border-color: #1d4ed8;
        }
    </style>
    {# The following block is meant to be overridden, but if not, it ensures 'content' is used #}
    {% block two_factor_content %}{% endblock %}
{% endblock content %}
