{% extends "layouts/base.html" %}
{% load static %}


{% block content %}

<main>
  <div class="p-4 block sm:flex items-center justify-between lg:mt-1.5">
    <div class="w-full mb-1">
      <div class="mb-4">
        <nav class="flex mb-5" aria-label="Breadcrumb">
          <ol class="inline-flex items-center space-x-1 text-sm font-medium md:space-x-2">
            <li class="inline-flex items-center">
              <a href="/"
                class="inline-flex items-center text-gray-700 dark:text-gray-300 hover:text-purple-700 dark:hover:text-purple-300">
                <svg class="w-5 h-5 mr-2.5" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M15 4H9v16h6V4Zm2 16h3a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3v16ZM4 4h3v16H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/>
                </svg>
                Dashboard
              </a>
            </li>
            <li>
              <div class="flex items-center">
                <svg class="w-6 h-6 text-gray-400" fill="currentColor" viewBox="0 0 20 20"
                  xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path></svg>
                <a href="/network" class="ml-1 text-gray-700 dark:text-gray-300 hover:text-purple-700 dark:hover:text-purple-300">Network</a>
              </div>
            </li>
            <li>
              <div class="flex items-center">
                <svg class="w-6 h-6 text-gray-400" fill="currentColor" viewBox="0 0 20 20"
                  xmlns="http://www.w3.org/2000/svg">
                  <path fill-rule="evenodd"
                    d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
                    clip-rule="evenodd"></path>
                </svg>
                <span class="ml-1 text-gray-400 md:ml-2 dark:text-gray-500" aria-current="page">New</span>
              </div>
            </li>
          </ol>
        </nav>
        <h1 class="text-xl font-semibold text-gray-900 sm:text-2xl dark:text-white">New Network</h1>
      </div>

      <section class="p-4 bg-white border mt-4 border-gray-200 rounded-lg shadow-sm dark:border-gray-700 sm:p-6 dark:bg-gray-800">
        <h2 class="mb-4 text-xl font-semibold dark:text-white">Create New Network</h2>

        <form method="POST" action="{% url 'new_network' %}" class="space-y-6" enctype="multipart/form-data">
          {% csrf_token %}
          <!-- Title -->
          <div>
            <label for="title" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Title</label>
            <input type="text" id="title" name="title" class="shadow-sm bg-gray-50 border border-gray-300 text-gray-900 sm:text-sm rounded-lg focus:ring-purple-700 focus:border-purple-700 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-purple-300 dark:focus:border-purple-300" placeholder="Enter network title" required />
          </div>
      
          <!-- Description -->
          <div>
            <label for="description" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Description</label>
            <textarea id="description" name="description" rows="4" class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-purple-700 focus:border-purple-700 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-purple-300 dark:focus:border-purple-300" placeholder="Write a brief project description..."></textarea>
          </div>

          <!-- Creation Method -->
          <div>
            <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Creation Method</label>
            <div class="flex items-center">
                <input id="create-new" name="creation_method" type="radio" value="create" class="w-4 h-4 text-purple-700 bg-gray-100 border-gray-300 focus:ring-purple-600 dark:focus:ring-purple-700 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600" checked>
                <label for="create-new" class="ml-2 text-sm font-medium text-gray-900 dark:text-gray-300">Create New Startup Package</label>
            </div>
            <div class="flex items-center">
                <input id="upload-package" name="creation_method" type="radio" value="upload" class="w-4 h-4 text-purple-700 bg-gray-100 border-gray-300 focus:ring-purple-600 dark:focus:ring-purple-700 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600">
                <label for="upload-package" class="ml-2 text-sm font-medium text-gray-900 dark:text-gray-300">Upload Startup Package</label>
            </div>
          </div>

          <!-- Conditional UI for Create New -->
          <div id="create-new-options" class="space-y-6">
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Test Locally</label>
                <input type="checkbox" name="local_test" id="local_test_checkbox" class="w-4 h-4 text-purple-700 bg-gray-100 border-gray-300 rounded focus:ring-purple-600 dark:focus:ring-purple-700 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600">
                <span class="ml-2 text-sm font-medium text-gray-900 dark:text-gray-300">Test in a local environment</span>
            </div>

            <div id="add-client-section">
              <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Add Client</label>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
                <input type="text" id="client-name" placeholder="client-1"
                  class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-purple-700 focus:border-purple-700 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white"
                />
                <input type="text" id="client-ip" placeholder="192.168.1.101"
                  class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-purple-700 focus:border-purple-700 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white"
                />
                <button type="button" onclick="addClientEntry()"
                  class="bg-purple-100 text-purple-700 border border-purple-100 hover:border-purple-700 font-medium rounded-lg text-sm px-4 py-2.5 h-full dark:bg-gray-700 dark:border-gray-700 dark:hover:border-purple-300 dark:text-purple-300">
                  Add Client
                </button>
              </div>
              <div class="mb-4">
               <ul id="client-list" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-purple-700 focus:border-purple-700 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white">
                </ul>
              </div>
            </div>
          </div>

          <!-- Conditional UI for Upload -->
          <div id="upload-package-options" class="space-y-6" style="display: none;">
            <label for="id_startup_package" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Startup Package</label>
            <label for="id_startup_package" class="flex items-center justify-center w-full h-32 border border-dashed rounded-lg cursor-pointer bg-gray-50 dark:hover:bg-gray-800 dark:bg-gray-700 hover:bg-gray-100 dark:border-gray-600 dark:hover:border-gray-500 dark:hover:bg-gray-600">
              <div class="flex flex-col items-center justify-center pt-5 pb-5">
                <svg class="w-6 h-6 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                  <path fill-rule="evenodd" d="M5 4a2 2 0 0 0-2 2v1h10.968l-1.9-2.28A2 2 0 0 0 10.532 4H5ZM3 19V9h18v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Zm9-8.5a1 1 0 0 1 1 1V13h1.5a1 1 0 1 1 0 2H13v1.5a1 1 0 1 1-2 0V15H9.5a1 1 0 1 1 0-2H11v-1.5a1 1 0 0 1 1-1Z" clip-rule="evenodd"/>
                </svg>
                <p class="mb-2 pt-2 text-sm text-gray-500 dark:text-gray-400"><span class="font-semibold">Click to upload</span></p>
                <p class="mb-2 text-xs font-semibold text-gray-500 dark:text-gray-400">Upload startup package (.zip)</p>
              </div>
              <input id="id_startup_package" name="startup_package" type="file" class="hidden" accept=".zip" />
            </label>
            <div id="startup_package_files_container" class="mt-4 hidden">
              <h3 class="text-sm font-medium text-gray-900 dark:text-white mb-2">Selected startup package:</h3>
              <div id="startup_package_files_list" class="bg-gray-50 dark:bg-gray-700 p-3 rounded-lg border border-gray-200 dark:border-gray-600 max-h-60 overflow-y-auto">
                <!-- File info will be inserted here by JavaScript -->
              </div>
            </div>
          </div>

          <!-- Submit Button -->
          <div class="flex justify-between items-center">
            <button type="submit" class="bg-purple-100 text-purple-700 border border-purple-100 hover:border-purple-700 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-gray-700 dark:border-gray-700 dark:hover:border-purple-300 dark:text-purple-300">
              Create Network
            </button>
            <a href="{% url 'network' %}" class="text-gray-500 bg-white border border-gray-300 hover:bg-gray-100 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-gray-700 dark:border-gray-600 dark:hover:bg-gray-600 dark:text-gray-300">
              Cancel
            </a>
          </div>
        </form>
      </section>
      
</main>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const createNewRadio = document.getElementById('create-new');
        const uploadPackageRadio = document.getElementById('upload-package');
        const createNewOptions = document.getElementById('create-new-options');
        const uploadPackageOptions = document.getElementById('upload-package-options');

        createNewRadio.addEventListener('change', () => {
            if (createNewRadio.checked) {
                createNewOptions.style.display = 'block';
                uploadPackageOptions.style.display = 'none';
            }
        });

        uploadPackageRadio.addEventListener('change', () => {
            if (uploadPackageRadio.checked) {
                createNewOptions.style.display = 'none';
                uploadPackageOptions.style.display = 'block';
            }
        });

        const localTestCheckbox = document.getElementById('local_test_checkbox');
        const addClientSection = document.getElementById('add-client-section');
        const clientNameInput = document.getElementById('client-name');
        const clientIpInput = document.getElementById('client-ip');
        const addClientButton = addClientSection.querySelector('button');

        localTestCheckbox.addEventListener('change', () => {
            if (localTestCheckbox.checked) {
                addClientSection.style.display = 'none';
                clientNameInput.disabled = true;
                clientIpInput.disabled = true;
                addClientButton.disabled = true;
                document.getElementById('client-list').innerHTML = '';
                const hiddenInputs = document.querySelectorAll('input[name="clients"]');
                hiddenInputs.forEach(input => input.remove());
            } else {
                addClientSection.style.display = 'block';
                clientNameInput.disabled = false;
                clientIpInput.disabled = false;
                addClientButton.disabled = false;
            }
        });

        // Handle file selection display for Startup Package (single .zip file)
        setupSingleFileUploadDisplay(
            "id_startup_package", 
            "startup_package_files_container", 
            "startup_package_files_list"
        );
    });

    function addClientEntry() {
        const clientNameInput = document.getElementById('client-name');
        const clientIpInput = document.getElementById('client-ip');
        const clientList = document.getElementById('client-list');

        const name = clientNameInput.value.trim();
        const ip = clientIpInput.value.trim();

        if (name && ip) {
            const li = document.createElement('li');
            li.className = 'flex justify-between items-center p-2';
            li.innerHTML = `<span>${name} - ${ip}</span><button type="button" class="text-red-500">Remove</button>`;
            
            const hiddenInput = document.createElement('input');
            hiddenInput.type = 'hidden';
            hiddenInput.name = 'clients';
            hiddenInput.value = JSON.stringify({ name, ip });
            li.appendChild(hiddenInput);

            clientList.appendChild(li);

            li.querySelector('button').addEventListener('click', () => {
                li.remove();
            });

            clientNameInput.value = '';
            clientIpInput.value = '';
        }
    }

    function setupSingleFileUploadDisplay(inputId, containerId, listId) {
        const fileInput = document.getElementById(inputId);
        const selectedFilesContainer = document.getElementById(containerId);
        const selectedFilesList = document.getElementById(listId);
        
        fileInput.addEventListener("change", function() {
            var file = fileInput.files[0];
            
            // Clear the previous list
            selectedFilesList.innerHTML = '';
            
            // Display selected file
            if (file) {
                selectedFilesContainer.classList.remove("hidden");
                
                const fileItem = document.createElement('div');
                fileItem.className = 'text-sm text-gray-700 dark:text-gray-300 py-1';
                fileItem.textContent = file.name + ' (' + formatFileSize(file.size) + ')';
                selectedFilesList.appendChild(fileItem);
            } else {
                selectedFilesContainer.classList.add("hidden");
            }
        });
    }

    function formatFileSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }
</script>

{% endblock content %}
