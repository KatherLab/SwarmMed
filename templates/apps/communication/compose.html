{% extends "layouts/base.html" %}
{% load static %}

{% block content %}
<main>
    <div class="px-4 pt-6">
        <div class="p-4 bg-white border border-gray-200 rounded-lg shadow-sm dark:border-gray-700 sm:p-6 dark:bg-gray-800 max-w-2xl mx-auto">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-bold leading-none text-gray-900 dark:text-white">Compose Message</h3>
                <a href="{% url 'communication:inbox' %}" class="text-sm text-gray-500 hover:underline">Back to Inbox</a>
            </div>
            
            <form method="post">
                {% csrf_token %}
                <div class="mb-4">
                    <label for="{{ form.recipient.id_for_label }}" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Recipient</label>
                    {{ form.recipient }}
                </div>
                <div class="mb-4">
                    <label for="{{ form.subject.id_for_label }}" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Subject</label>
                    {{ form.subject }}
                </div>
                <div class="mb-4">
                    <label for="{{ form.body.id_for_label }}" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Message</label>
                    {{ form.body }}
                </div>
                <button type="submit" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 mr-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">Send Message</button>
            </form>
        </div>
    </div>
</main>
{% endblock %}
