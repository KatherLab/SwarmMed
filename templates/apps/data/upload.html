{% extends "layouts/base.html" %}
{% load static %}


{% block content %}

<main>
  <div
    class="p-4 bg-white block sm:flex items-center justify-between border-b border-gray-200 lg:mt-1.5 dark:bg-gray-800 dark:border-gray-700">
    <div class="w-full mb-1">
      <div class="mb-4">
        <nav class="flex mb-5" aria-label="Breadcrumb">
          <ol class="inline-flex items-center space-x-1 text-sm font-medium md:space-x-2">
            <li class="inline-flex items-center">
              <a href="/"
                class="inline-flex items-center text-gray-700 hover:text-primary-600 dark:text-gray-300 dark:hover:text-white">
                <svg class="w-5 h-5 mr-2.5" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M15 4H9v16h6V4Zm2 16h3a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3v16ZM4 4h3v16H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/>
                </svg>
                Dashboard
              </a>
            </li>
            <li>
              <div class="flex items-center">
                <svg class="w-6 h-6 text-gray-400" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path></svg>
                <a href="#" class="ml-1 text-gray-700 hover:text-primary-600 md:ml-2 dark:text-gray-300 dark:hover:text-white">Data</a>
              </div>
            </li>
            <li>
              <div class="flex items-center">
                <svg class="w-6 h-6 text-gray-400" fill="currentColor" viewBox="0 0 20 20"
                  xmlns="http://www.w3.org/2000/svg">
                  <path fill-rule="evenodd"
                    d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
                    clip-rule="evenodd"></path>
                </svg>
                <span class="ml-1 text-gray-400 md:ml-2 dark:text-gray-500" aria-current="page">Upload</span>
              </div>
            </li>
          </ol>
        </nav>
        <h1 class="text-xl font-semibold text-gray-900 sm:text-2xl dark:text-white">Upload</h1>
      </div>

    
        

   <div class="max-w-lg mx-auto bg-white p-6 rounded shadow">
        <h2 class="text-2xl font-bold mb-4">Upload Files or Folders</h2>
        <form id="upload_form" method="post" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            <label class="block mb-2 text-sm font-medium text-gray-900" for="file_input">Select files or folders</label>
            <input class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 focus:outline-none"
                   id="file_input"
                   type="file"
                   name="file_field"
                   multiple
                   webkitdirectory
                   directory>
            <input type="hidden" id="directories" name="directories" />
            <button type="submit" id="submit_btn" class="mt-4 px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Upload</button>
        </form>
        <!-- Progress Bar -->
        <div id="progress_container" class="w-full bg-gray-200 rounded-full h-4 mt-4 hidden">
            <div id="progress_bar" class="bg-blue-600 h-4 rounded-full text-xs text-white text-center" style="width: 0%;">0%</div>
        </div>
        <!-- Success Message -->
        <div id="success_message" class="hidden mt-4 p-4 bg-green-100 text-green-800 rounded">
            Files uploaded successfully!
        </div>
    </div>
    <script>
        const fileInput = document.getElementById("file_input");
        const directoriesInput = document.getElementById("directories");
        const form = document.getElementById("upload_form");
        const progressContainer = document.getElementById("progress_container");
        const progressBar = document.getElementById("progress_bar");
        const successMessage = document.getElementById("success_message");
        const submitBtn = document.getElementById("submit_btn");

        fileInput.addEventListener("change", function() {
            var files = fileInput.files;
            var directories = {};
            for (var i = 0; i < files.length; i++) {
                directories[files[i].name + '_' + i] = files[i].webkitRelativePath;
            }
            directoriesInput.value = JSON.stringify(directories);
        });

        form.addEventListener("submit", function(e) {
            e.preventDefault();
            progressContainer.classList.remove("hidden");
            progressBar.style.width = "0%";
            progressBar.textContent = "0%";
            successMessage.classList.add("hidden");
            submitBtn.disabled = true;

            var formData = new FormData(form);

            var xhr = new XMLHttpRequest();
            xhr.open("POST", form.action, true);

            xhr.upload.addEventListener("progress", function(e) {
                if (e.lengthComputable) {
                    var percent = Math.round((e.loaded / e.total) * 100);
                    progressBar.style.width = percent + "%";
                    progressBar.textContent = percent + "%";
                }
            });

            xhr.onreadystatechange = function() {
                if (xhr.readyState === XMLHttpRequest.DONE) {
                    submitBtn.disabled = false;
                    if (xhr.status === 200) {
                        progressBar.style.width = "100%";
                        progressBar.textContent = "100%";
                        successMessage.classList.remove("hidden");
                        form.reset();
                        // Optionally, hide progress bar after a delay
                        setTimeout(() => {
                            progressContainer.classList.add("hidden");
                        }, 1500);
                    } else {
                        progressBar.style.width = "0%";
                        progressBar.textContent = "0%";
                        alert("Upload failed. Please try again.");
                    }
                }
            };

            xhr.send(formData);
        });
    </script>

  
{% endblock content %}
