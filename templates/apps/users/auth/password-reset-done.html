{% extends "layouts/base-auth.html" %}
{% load static %}


{% block content %}

<div class="flex flex-col items-center justify-center px-6 pt-8 mx-auto md:h-screen pt:mt-0 dark:bg-gray-900">
    <a href="/" class="flex items-center justify-center mb-8 text-2xl font-semibold lg:mb-10 dark:text-white">
        <img src="{% static 'dist/images/logo.png' %}" class="mr-4 h-11" alt="SwarmMedHub Logo">
        <span>SwarmMedHub</span>  
    </a>
    <!-- Card -->
    <div class="w-full max-w-xl p-6 space-y-8 bg-white rounded-lg shadow sm:p-8 dark:bg-gray-800">
        <h2 class="text-2xl font-bold text-gray-900 dark:text-white">
            Email Sent
        </h2>
        <span class="block text-sm font-medium text-gray-500 dark:text-gray-400">An email has been sent to your email address. Please click the link and reset your password.</span>
        <div class="flex justify-end mt-6">
            <a href="{% url "users:signin" %}" class="bg-purple-100 text-purple-700 border border-purple-100 hover:border-purple-700 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-gray-700 dark:border-gray-700 dark:hover:border-purple-300 dark:text-purple-300">
                Back to login
            </a>
        </div>
    </div>
</div>

{% endblock content %}
