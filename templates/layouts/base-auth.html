{% load static %}

<!doctype html>
<html lang="en">
<head>

    {% include "includes/head.html" %}

    <style>
        /* Global styling for authentication form inputs */
        .auth-card input:not([type="checkbox"]):not([type="radio"]), 
        .auth-card select,
        .auth-card textarea {
            width: 100%;
            padding: 0.625rem;
            font-size: 0.875rem;
            line-height: 1.25rem;
            border-radius: 0.5rem;
            border-width: 1px;
            --tw-bg-opacity: 1;
            background-color: rgb(249 250 251 / var(--tw-bg-opacity));
            --tw-border-opacity: 1;
            border-color: rgb(209 213 219 / var(--tw-border-opacity));
            --tw-text-opacity: 1;
            color: rgb(17 24 39 / var(--tw-text-opacity));
            --tw-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --tw-shadow-colored: 0 1px 2px 0 var(--tw-shadow-color);
            box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
        }

        .dark .auth-card input:not([type="checkbox"]):not([type="radio"]), 
        .dark .auth-card select,
        .dark .auth-card textarea {
            --tw-bg-opacity: 1;
            background-color: rgb(55 65 81 / var(--tw-bg-opacity));
            --tw-border-opacity: 1;
            border-color: rgb(75 85 99 / var(--tw-border-opacity));
            --tw-text-opacity: 1;
            color: rgb(255 255 255 / var(--tw-text-opacity));
        }

        .auth-card input:focus, .auth-card select:focus, .auth-card textarea:focus {
            outline: 2px solid transparent;
            outline-offset: 2px;
            --tw-ring-offset-shadow: var(--tw-ring-inset) 0 0 0 var(--tw-ring-offset-width) var(--tw-ring-offset-color);
            --tw-ring-shadow: var(--tw-ring-inset) 0 0 0 calc(3px + var(--tw-ring-offset-width)) var(--tw-ring-color);
            box-shadow: var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow, 0 0 #0000);
            --tw-ring-opacity: 1;
            --tw-ring-color: rgb(126 58 242 / var(--tw-ring-opacity));
            --tw-border-opacity: 1;
            border-color: rgb(126 58 242 / var(--tw-border-opacity));
        }

        .dark .auth-card input:focus, .dark .auth-card select:focus, .dark .auth-card textarea:focus {
            --tw-ring-color: rgb(167 139 250 / var(--tw-ring-opacity));
            --tw-border-opacity: 1;
            border-color: rgb(167 139 250 / var(--tw-border-opacity));
        }
    </style>

</head>
  <body class="bg-gray-50 dark:bg-gray-800">

    <main class="bg-gray-50 dark:bg-gray-900">
      {% block content %}{% endblock content %}
    </main>

    {% include "includes/scripts.html" %}
    
  </body>
</html>
