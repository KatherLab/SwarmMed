{% load static %}

<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MedSwarmHub</title>

<meta name="description"
  content="MedSwarmHub your decentralized medical ai platform">

<link rel="canonical" href="https://app-generator.dev/product/rocket/django/">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="apple-touch-icon" sizes="180x180" href="{% static 'dist/images/logo.png' %}">
<link rel="icon" type="image/png" sizes="32x32" href="{% static 'dist/images/logo.png' %}">
<link rel="icon" type="image/png" sizes="16x16" href="{% static 'dist/images/logo.png' %}">
<link rel="icon" type="image/png" href="{% static 'dist/images/logo.png' %}">

<meta name="msapplication-TileColor" content="#ffffff">
<meta name="theme-color" content="#ffffff">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@">
<meta name="twitter:creator" content="@">
<meta name="twitter:title" content="MedSwarmHub - Decentralized Medical AI Platform">
<meta name="twitter:description"
  content="Open-Source Decentralized Data Storage and AI Platform">

<!-- Facebook -->
<meta property="og:url" content="https://github.com/pfeifferis/MedSwarmHub">
<meta property="og:title" content="MedSwarmHub - Decentralized Medical AI Platform">
<meta property="og:description"
  content="Open-Source Decentralized Data Storage and AI Platform">
<meta property="og:type" content="website">
<meta property="og:image" content="{% static 'dist/images/logo.png' %}">
<meta property="og:image:type" content="image/png">

<link rel="stylesheet" href="{% static 'dist/main.css' %}">

<script>

  if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
  } else {
    document.documentElement.classList.remove('dark')
  }
</script>
