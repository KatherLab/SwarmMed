[project]
name = "medswarmhub"
version = "0.1.0"
description = "A Decentralized Federated Learning Platform for Medical Data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "PolyForm Noncommercial License 1.0.0" }
authors = [
    { name = "Kevin Pfeiffer" },
]
maintainers = [
    { name = "SwarmCloud Maintainers" },
]
keywords = [
    "django",
    "federated-learning",
    "medical-ai",
    "mlops",
    "security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
urls = { Homepage = "https://github.com/pfeifferis/SwarmCloud", Repository = "https://github.com/pfeifferis/SwarmCloud", Documentation = "https://github.com/pfeifferis/SwarmCloud/tree/main/docs", Issues = "https://github.com/pfeifferis/SwarmCloud/issues" }
dependencies = [
    "django==6.0.0",
    "django-axes==6.4.0",
    "python-dotenv==1.0.1",
    "str2bool==1.1",
    "django-two-factor-auth==1.15.5",
    "django-otp==1.2.4",
    "phonenumbers==8.13.52",
    "qrcode==7.4.2",
    "django-debug-toolbar==4.2.0",
    "pillow==11.1.0",
    "django-unfold==0.75.0",
    "redis==5.0.1",
    "hiredis==3.1.0",
    "celery==5.3.4",
    "whitenoise==6.5.0",
    "gunicorn==23.0.0",
    "psycopg2-binary==2.9.9",
    "django-storages==1.14.4",
    "boto3==1.34.100",
    "pandas==2.3.3",
    "numpy==2.4.3",
    "matplotlib==3.10.0",
    "seaborn==0.13.2",
    "scikit-learn==1.8.0",
    "torch==2.10.0",
    "tensorflow==2.21.0",
    "keras==3.13.0",
    "pytorch-lightning==2.4.0",
    "transformers==5.3.0",
    "datasets",
    "monai==1.5.2",
    "fsspec==2025.2.0",
    "aiohttp==3.13.3",
    "nvflare==2.7.1",
    "docker==7.1.0",
    "cryptography==46.0.5",
]

[project.optional-dependencies]
sandbox = [
    "numpy==2.4.3",
    "pandas==2.3.3",
    "matplotlib==3.10.0",
    "seaborn==0.13.2",
    "scikit-learn==1.8.0",
    "torch==2.10.0",
    "tensorflow==2.21.0",
    "keras==3.13.0",
    "pytorch-lightning==2.4.0",
    "transformers==5.3.0",
    "datasets",
    "monai==1.5.2",
    "fsspec==2025.2.0",
    "aiohttp==3.13.3",
    "requests==2.32.4",
]
dev = [
    "ipython>=8.22.0",
    "model-bakery>=1.17.0",
    "pre-commit>=4.0.1",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-django>=4.8.0",
    "ruff>=0.3.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]

[project.scripts]
manage = "manage:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "core"]

[tool.hatch.build]
include = [
    "apps",
    "core",
    "manage.py",
    "scripts",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.1",
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-django>=4.8.0",
    "model-bakery>=1.17.0",
    "ipython>=8.22.0",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "*/migrations/*.py",
]

# Same as Black.
line-length = 88
indent-width = 4

target-version = "py312"
src = ["apps", "core"]

[tool.ruff.lint]
# Enable Pyflakes (`F`), pycodestyle (`E`), and pydocstyle (`D`) codes.
select = ["E", "F", "D", "I", "B", "UP", "SIM"]
ignore = [
    "D100", # Missing docstring in public module (too noisy for small scripts)
    "D104", # Missing docstring in public package (__init__.py)
    "D106", # Missing docstring in public nested class (common in Django Meta)
    "D203", # 1 blank line required before class docstring (conflicts with D211)
    "D213", # Multi-line docstring summary should start at the second line
]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["D", "E501"]
"**/tests.py" = ["D"]
"**/test_*.py" = ["D"]
"**/__init__.py" = ["F401"]
"examples/*.py" = ["F821", "D", "E501"]
"examples/**/*.py" = ["F821", "D", "E501"]
"scripts/*.py" = ["D", "E501"]
"services/**/*.py" = ["D", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings.development"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra --strict-markers --strict-config --reuse-db"
testpaths = ["apps"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["apps", "core"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
