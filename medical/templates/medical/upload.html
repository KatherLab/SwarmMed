{% extends 'medical/base.html' %}
{% block title %}<title>Upload Medical Data</title>{% endblock %}
{% block content %}
<div class="bg-white p-8 rounded max-w-md mx-auto">
    <h1 class="text-2xl font-bold mb-4">Upload Medical Data File</h1>
    <form method="post" enctype="multipart/form-data" class="space-y-4">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="w-full px-4 py-2 bg-green-500 text-white rounded hover:bg-red-600">
          Upload
      </button>
    </form>
</div>
{% endblock %}
