site_name: SwarmMed Documentation

repo_name: pfeifferis/SwarmCloud
repo_url: https://github.com/pfeifferis/SwarmCloud

nav:
    - Home: index.md
    - Background: background.md
    - Security: security.md
    - Getting Started: getting-started.md
    - Usage: usage.md
    - CLI: cli.md
    - DUKE MST CLI Evaluation: duke-mst-cli-evaluation.md
    - Installation: installation.md
    - Developer: developer.md
    - Contribution: contribution.md

extra:
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://kather.ai
      name: KatherLab Website
    - icon: fontawesome/brands/x-twitter 
      link: https://x.com/katherlab
      name: KatherLab on X
    - icon: fontawesome/brands/github 
      link: https://github.com/KatherLab
      name: KatherLab on Github

copyright: >
  &copy; 2026 Kather Lab –
  <a href="https://kather.ai">Imprint and Privacy Policy</a>  <a href="#__consent">Change cookie settings</a> 

theme:
  name: material

  font:
    text: Open Sans
  language: en

  logo: assets/images/logo.png

  favicon: assets/images/favicon.png

  palette: 
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
      primary: white
      accent: deep purple
    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
      primary: black
      accent: deep purple

  icon:
    repo: fontawesome/brands/square-github
      
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - toc.integrate
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.select
    - content.code.annotate

markdown_extensions:
  - abbr
  - attr_list
  - md_in_html
  - admonition
  - def_list
  - tables
  - footnotes
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.betterem
  - pymdownx.superfences:
      custom_fences:
          - name: mermaid
            class: mermaid
            format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
